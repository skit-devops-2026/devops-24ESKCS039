groups:
  - name: elara-app-alerts
    rules:
      - alert: AppDown
        expr: up{job="elara-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ELARA app has been unreachable for over a minute"

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "ELARA 95th percentile latency is above 1 second"

      - alert: HighErrorRate
        expr: rate(http_requests_total{status_code=~"5.."}[5m]) > 0.05
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "ELARA is serving more than 5% 5xx errors"

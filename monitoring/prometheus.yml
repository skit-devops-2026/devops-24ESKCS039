global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert.rules.yml"

scrape_configs:
  - job_name: "elara-app"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["app:5000"]
        labels:
          app: "elara"
          env: "production"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
